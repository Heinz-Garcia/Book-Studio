# Commit-Sperre (Konsolidierungsplan, Paket 1). Einmal pro Klon installieren:
#
#   pip install -r requirements.txt
#   python -m pre_commit install
#
# ruff-format ist bewusst NICHT dabei: Es würde 100 bisher unformatierte Dateien
# bei der ersten Berührung komplett umschreiben und jede kleine Änderung mit
# fachfremden Diffs mischen. Einheitliche Formatierung ist ein eigener Schritt
# (Paket 7, Aufräumen).
# Überspringen nur bewusst: git commit --no-verify
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]
        # Phase 2 / Schritt 4: flake8 liest die zentrale `.flake8`-Config.
        # Keine doppelten CLI-Args hier, damit Pre-Commit und CI
        # dieselben Regeln anwenden.

  - repo: local
    hooks:
      - id: python-compile
        name: Python compile check
        entry: python -m compileall -q
        language: system
        types: [python]
        pass_filenames: false
        args: ["."]
      - id: test-gate
        name: Test-Sperre (schnelle Suite, parallel)
        entry: python tools/dev/test_gate.py
        language: system
        pass_filenames: false
        exclude: "^(\\.doc/|doc/)"

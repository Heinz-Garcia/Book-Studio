name: Reisefuehrer_Andalusien
label: Reiseführer Andalusien (Druck, 135 × 215 mm)
description: Druckfertiges DOCX-Layout für »Ernstfall Urlaub«. Seitengeometrie aus dem Druckprofil (Pb)
  Paperback; Cambria im Satz, Calibri in den Überschriften. Deckt alle Formatierungsobjekte des Bandes
  ab.
page:
  width_mm: 135.0
  height_mm: 215.0
  mirrored: true
  margin:
    top_mm: 19.0
    bottom_mm: 20.0
    inner_mm: 20.0
    outer_mm: 16.0
  header_distance_mm: 12.5
  footer_distance_mm: 12.5
  footer:
    page_number: true
    align: center
typography:
  body_font: Cambria
  heading_font: Calibri
  mono_font: Consolas
  base_size_pt: 11.0
  table_size_pt: 8.5
  line_height: 1.2
  language: de-DE
  hyphenation: true
  hyphenation_zone_mm: 5.0
  hyphenate_caps: false
colors:
  accent: 1F3864
  accent2: 2E5C8A
  fill: EEF3F9
  footer: 7F7F7F
  muted: '595959'
  rule: 9DB2CE
  table_border: BFBFBF
  table_border_light: DCDCDC
  table_header: F2F4F7
styles:
  Title:
    size_pt: 26.0
    color: accent
    space_before_pt: 0.0
    space_after_pt: 6.0
    line_height: 1.0
  Author:
    size_pt: 11.0
    space_before_pt: 0.0
    space_after_pt: 2.0
  Prompt-Frage:
    name: Prompt-Frage
    based_on: BodyText
    next: BodyText
    size_pt: 13.0
    color: accent
    space_before_pt: 3.0
    space_after_pt: 12.0
    line_height: 1.1
    outline_level: 1
    shading: fill
    bold: true
    keep_next: true
    keep_lines: true
    indent:
      left_mm: 9.0
      right_mm: 2.0
      hanging_mm: 7.0
      first_line_mm: 0.0
    borders:
      bottom:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
      left:
        width_pt: 2.25
        color: accent2
        space_pt: 4.0
        style: single
      right:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
      top:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
  Fachtext:
    name: Fachtext
    based_on: BodyText
    next: Fachtext
    space_before_pt: 0.0
    space_after_pt: 7.0
  Prompt-Trenner:
    name: Prompt-Trenner
    next: Prompt-Frage
    size_pt: 14.0
    color: rule
    letter_spacing_pt: 3.0
    align: center
    space_before_pt: 20.0
    space_after_pt: 6.0
    line_height: 1.0
    keep_next: true
  Themenblock:
    name: Themenblock
    based_on: Heading2
    next: BodyText
    size_pt: 20.0
    color: accent
    space_before_pt: 0.0
    space_after_pt: 16.0
    outline_level: 0
    bold: true
    keep_next: true
    keep_lines: true
    page_break_before: true
    borders:
      bottom:
        width_pt: 1.5
        color: accent2
        space_pt: 3.0
        style: single
  TOC1:
    size_pt: 12.0
    color: accent
    space_before_pt: 14.0
    space_after_pt: 3.0
    bold: true
  BodyText:
    name: Fließtext
    based_on: Normal
    next: BodyText
    align: justify
    space_before_pt: 0.0
    space_after_pt: 3.0
    line_height: 1.2
  FirstParagraph:
    name: Erster Absatz
    based_on: BodyText
    next: BodyText
  Heading1:
    name: Überschrift 1
    based_on: Normal
    next: FirstParagraph
    size_pt: 16.0
    color: accent
    align: left
    space_before_pt: 0.0
    space_after_pt: 10.0
    outline_level: 0
    bold: true
    keep_next: true
    keep_lines: true
    page_break_before: true
  Heading2:
    name: Überschrift 2
    based_on: Normal
    next: FirstParagraph
    size_pt: 14.0
    color: accent
    space_before_pt: 12.0
    space_after_pt: 4.0
    outline_level: 1
    bold: true
    keep_next: true
    keep_lines: true
  Heading3:
    name: Überschrift 3
    based_on: Normal
    next: FirstParagraph
    size_pt: 11.5
    color: accent2
    space_before_pt: 9.0
    space_after_pt: 3.0
    outline_level: 2
    bold: true
    keep_next: true
    keep_lines: true
  Heading4:
    name: Überschrift 4
    based_on: Normal
    next: FirstParagraph
    size_pt: 11.0
    color: muted
    space_before_pt: 7.0
    space_after_pt: 2.0
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    keep_lines: true
  Compact:
    name: Kompakt
    based_on: BodyText
    next: Compact
    align: left
    space_before_pt: 0.0
    space_after_pt: 1.5
    line_height: 1.15
  BlockText:
    name: Blockzitat
    based_on: BodyText
    next: BodyText
    color: muted
    align: left
    space_before_pt: 6.0
    space_after_pt: 6.0
    italic: true
    indent:
      left_mm: 6.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
    borders:
      left:
        width_pt: 1.5
        color: rule
        space_pt: 4.0
        style: single
  SourceCode:
    name: Quelltext
    based_on: Normal
    next: BodyText
    size_pt: 9.0
    align: left
    space_before_pt: 4.0
    space_after_pt: 4.0
    line_height: 1.0
    shading: fill
    indent:
      left_mm: 3.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
classmap:
  fachtext: Fachtext
  prompt: Prompt-Frage
  prompt-separator: Prompt-Trenner
  themenblock: Themenblock

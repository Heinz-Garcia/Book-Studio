name: Prosa_Layout
label: Prosa
description: 'Layout für Prosa-Bände, abgeleitet vom IFJN-Layout (IFJN_layout): Absätze mit Erstzeileneinzug
  4 mm statt eigenem Fließtext-Format, sonst Seiten, Schriften und Verzeichnis wie dort.'
page:
  width_mm: 135.0
  height_mm: 215.0
  mirrored: true
  margin:
    top_mm: 19.0
    bottom_mm: 20.0
    inner_mm: 20.0
    outer_mm: 16.0
  header_distance_mm: 12.5
  footer_distance_mm: 12.5
  footer:
    page_number: true
    align: center
typography:
  body_font: Cambria
  heading_font: Calibri
  mono_font: Consolas
  base_size_pt: 11.0
  line_height: 1.15
  language: de-DE
  hyphenation: true
  hyphenation_zone_mm: 5.0
  hyphenate_caps: false
colors:
  accent: 1F3864
  accent2: 2E5C8A
  fill: EEF3F9
  footer: 7F7F7F
  muted: '595959'
  rule: 9DB2CE
  table_border: BFBFBF
  table_border_light: DCDCDC
  table_header: F2F4F7
styles:
  Title:
    size_pt: 26.0
    color: accent
    space_before_pt: 0.0
    space_after_pt: 6.0
    line_height: 1.0
  Author:
    size_pt: 11.0
    space_before_pt: 0.0
    space_after_pt: 2.0
  Prompt-Frage:
    name: Prompt-Frage
    based_on: BodyText
    next: BodyText
    size_pt: 13.0
    color: accent
    space_before_pt: 3.0
    space_after_pt: 12.0
    line_height: 1.1
    outline_level: 1
    shading: fill
    bold: true
    keep_next: true
    keep_lines: true
    indent:
      left_mm: 9.0
      right_mm: 2.0
      hanging_mm: 7.0
      first_line_mm: 0.0
    borders:
      bottom:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
      left:
        width_pt: 2.25
        color: accent2
        space_pt: 4.0
        style: single
      right:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
      top:
        width_pt: 0.25
        color: rule
        space_pt: 3.0
        style: single
  Fachtext:
    name: Fachtext
    based_on: BodyText
    next: Fachtext
    align: justify
    space_before_pt: 0.0
    space_after_pt: 7.0
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 4.0
  Prompt-Trenner:
    name: Prompt-Trenner
    next: Prompt-Frage
    size_pt: 14.0
    color: rule
    letter_spacing_pt: 3.0
    align: center
    space_before_pt: 20.0
    space_after_pt: 6.0
    line_height: 1.0
    keep_lines: true
  TOC1:
    size_pt: 12.0
    color: accent
    space_before_pt: 14.0
    space_after_pt: 3.0
    bold: true
  Themenblock:
    name: Themenblock
    based_on: Heading2
    next: BodyText
    size_pt: 20.0
    color: accent
    space_before_pt: 0.0
    space_after_pt: 16.0
    outline_level: 0
    bold: true
    keep_next: true
    keep_lines: true
    page_break_before: true
    borders:
      bottom:
        width_pt: 1.5
        color: accent2
        space_pt: 3.0
        style: single
  Impressum:
    name: Impressum
    based_on: BodyText
    next: Impressum
    align: left
    space_before_pt: 0.0
    space_after_pt: 6.0
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
  Callout:
    name: Callout
    based_on: BodyText
    next: BodyText
    align: left
    language: de-DE
    shading: fill
    space_before_pt: 12.0
    space_after_pt: 12.0
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
    borders:
      bottom:
        width_pt: 0.75
        color: accent2
        space_pt: 4.0
        style: single
      left:
        width_pt: 2.25
        color: accent
        space_pt: 4.0
        style: single
      right:
        width_pt: 0.75
        color: accent2
        space_pt: 4.0
        style: single
      top:
        width_pt: 0.75
        color: accent2
        space_pt: 4.0
        style: single
  TOC2:
    size_pt: 11.0
    space_before_pt: 3.0
    space_after_pt: 0.0
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
  TOC3:
    size_pt: 11.0
    space_before_pt: 0.0
    space_after_pt: 0.0
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
  Titelei-Autor:
    name: Titelei-Autor
    based_on: BodyText
    next: Titelei-Autor
    size_pt: 13.0
    align: center
    space_before_pt: 0.0
    space_after_pt: 6.0
    keep_next: true
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
  Titelei-Titel:
    name: Titelei-Titel
    based_on: BodyText
    next: Titelei-Titel
    size_pt: 26.5
    align: center
    space_before_pt: 0.0
    space_after_pt: 6.0
    keep_next: true
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
  Titelei-Zusatz:
    name: Titelei-Zusatz
    based_on: BodyText
    next: Titelei-Zusatz
    size_pt: 11.0
    align: center
    space_before_pt: 0.0
    space_after_pt: 6.0
    keep_next: true
    indent:
      left_mm: 0.0
      right_mm: 0.0
      hanging_mm: 0.0
      first_line_mm: 0.0
classmap:
  fachtext: Fachtext
  prompt: Prompt-Frage
  prompt-separator: Prompt-Trenner
  themenblock: Themenblock
  impressum: Impressum
  callout: Callout
  callout-tip: Callout
  callout-note: Callout
  callout-warning: Callout
  callout-caution: Callout
  callout-important: Callout
  titelei-autor: Titelei-Autor
  titelei-titel: Titelei-Titel
  titelei-zusatz: Titelei-Zusatz

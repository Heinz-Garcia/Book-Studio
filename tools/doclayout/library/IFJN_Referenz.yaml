  width_mm: 210.0
  height_mm: 297.0
  mirrored: false
  margin:
    top_mm: 20.0
    bottom_mm: 20.0
    inner_mm: 25.0
    outer_mm: 20.0
  header_distance_mm: 12.5
  footer_distance_mm: 12.5
  footer:
    page_number: true
    align: center
typography:
  body_font: Calibri
  heading_font: ''
  mono_font: Consolas
  base_size_pt: 11.0
  line_height: 1.15
  language: de-DE
  hyphenation: true
  hyphenation_zone_mm: 5.0
  hyphenate_caps: false
colors:
  accent: 1F3864
  accent2: 2E5C8A
  fill: EEF3F9
  footer: 7F7F7F
  muted: '595959'
  rule: 9DB2CE
  table_border: BFBFBF
  table_border_light: DCDCDC
  table_header: F2F4F7

name: IFJN_Referenz
label: IFJN Referenz (vollstaendig)
description: 'Vollstaendige Rueckfallebene: alle Absatzformate aus Pandocs Basisvorlage plus die Inhaltsformate
  der IFJN-Baende. Zum Duplizieren gedacht, nicht zum Bearbeiten - wer hier etwas loescht, verliert die
  Rueckfallebene.'

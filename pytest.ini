[pytest]
markers =
    slow: marks tests as slow (involves real Quarto render). Run with `-m "not slow"` in fast CI loops.
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
testpaths =
    tests
addopts =
    -ra
# Coverage-Konfiguration: .coveragerc (hier las coverage.py sie nie).
# Schwellen je Bereich: tools/dev/coverage_gate.py (Teil der Commit-Sperre).
